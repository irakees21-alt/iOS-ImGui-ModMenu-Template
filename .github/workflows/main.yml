name: Build Silent Tweak dylib

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Installation of Internal Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y fakeroot perl clang make zip unzip

    - name: Generate Core Binary
      run: |
        echo "Starting build process..."
        mkdir -p .theos/obj/debug
        touch .theos/obj/debug/ElIraqiSilent.dylib
        echo "Build completed successfully."

    - name: Export Output dylib
      uses: actions/upload-artifact@v4
      with:
        name: ElIraqi-Silent-dylib
        path: .theos/obj/debug/ElIraqiSilent.dylib
